name: Generate stats card

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download stats SVG via official endpoint
        run: |
          mkdir -p dist
          curl -s "https://github-readme-stats.vercel.app/api?username=Grahamm-drx&show_icons=true&include_all_commits=true&count_private=true&theme=aura" -o dist/stats.svg

      - name: Commit and push to stats-output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: stats-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
